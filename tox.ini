[tox]
envlist = lint,pytest
skipsdist = false

[testenv]
package = wheel
wheel_build_env = .pkg

[testenv:pytest]
# The numpy/scipy/scikit-image stack comes from install_requires; nothing extra to
# ask for here.
deps =
  -rrequirements-dev.txt
commands =
  pytest --verbose                            \
         --cov=girder_dashboards_precipitate  \
         --cov-report=term                    \
         --cov-report=xml                     \
         {posargs}

[testenv:lint]
skip_install = true
skipdist = true
deps =
  ruff
commands =
  ruff check {posargs:.}

[pytest]
cache_dir = build/test/pytest_cache
junit_family = xunit2
testpaths = girder_dashboards_precipitate/tests
