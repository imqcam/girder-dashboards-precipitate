[tox]
envlist = lint,pytest
# tox-uv builds every env with uv, which hardlinks from the shared uv cache
# instead of copying a few hundred MB per env.
requires = tox-uv>=1.26
skipsdist = false

[testenv]
package = wheel
wheel_build_env = .pkg

[testenv:pytest]
# The numpy/scipy/scikit-image stack comes from the project dependencies; nothing
# extra to ask for here.
dependency_groups = dev
commands =
  pytest --verbose                            \
         --cov=girder_dashboards_precipitate  \
         --cov-report=term                    \
         --cov-report=xml                     \
         {posargs}

[testenv:lint]
skip_install = true
skipdist = true
deps =
  ruff
commands =
  ruff check {posargs:.}
